services:
  # ==========================================
  # 1. MongoDB Database Service
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: taskflow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taskflow
    volumes:
      - mongo-data:/data/db
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Express Backend REST API Service
  # ==========================================
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/taskflow
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_taskflow_docker_2026_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5174}
      MAX_FILE_SIZE: 5242880
      UPLOAD_PATH: uploads
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ==========================================
  # 3. React Vite Frontend (Nginx SPA)
  # ==========================================
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8088:80"
    networks:
      - taskflow-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==========================================
# Named Volumes for Persistent Storage
# ==========================================
volumes:
  mongo-data:
    name: taskflow-mongo-data
  backend-uploads:
    name: taskflow-backend-uploads

# ==========================================
# Bridge Network for Inter-Container Communication
# ==========================================
networks:
  taskflow-network:
    name: taskflow-network
    driver: bridge
