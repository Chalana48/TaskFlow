name: TaskFlow Docker Build & Image Verification

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docker:
    name: Validate Docker Compose & Build Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository source
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          load: true
          tags: taskflow-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          build-args: |
            VITE_API_URL=/api
          push: false
          load: true
          tags: taskflow-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify Built Docker Images Stored in Local Engine
        run: |
          docker images --filter "reference=taskflow-*"
